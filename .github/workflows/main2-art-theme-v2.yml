name: "Main2 · Semantic Art Theme V2"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  semantic-theme:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify semantically named runtime sources and exact file headers
        run: python3 tools/validate_art_theme_v2.py --json
      - name: Audit generated image count, hashes, and orphaned image paths
        run: python3 tools/audit_generated_only_art_v1.py --project . --report build/art-theme-v2/inventory.json
      - name: Reject random atlas reassembly
        run: python3 tools/validate_nonrandom_atlas_v2.py
      - name: Verify current runtime image registry and theme
        run: |
          python3 tools/check_c_art_runtime_registry.py
          python3 tools/qa_hd2d_refinement.py
      - name: Install Godot 4.7.2
        shell: bash
        run: |
          curl -fL --retry 3 -o /tmp/godot-v2.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -oq /tmp/godot-v2.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: Import and parse all game scripts
        run: timeout 180s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit
      - name: Compile explicitly mapped material atlas
        run: timeout 180s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tools/compile_art_atlas_v2.gd
      - name: Activate semantic theme, load actual art and restore
        run: timeout 180s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tools/smoke_c_art_theme_v2.gd
      - name: Validate existing coastal world/room art integration
        run: |
          timeout 180s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tools/smoke_c_act01_semantic_v17.gd
          timeout 180s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tools/smoke_c_main2_art_runtime.gd
