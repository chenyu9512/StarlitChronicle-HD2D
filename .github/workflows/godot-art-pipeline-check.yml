name: Main2 Art Pipeline Focused Godot Check
on:
  workflow_dispatch:
  push:
    branches: ["Main2美术优化版"]
    paths:
      - "addons/starlit_art_pipeline/**"
      - "tools/check_starlit_art_pipeline.gd"
      - ".github/workflows/godot-art-pipeline-check.yml"
permissions:
  contents: read
jobs:
  parser-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Cache official Godot 4.7.2 binary
        uses: actions/cache@v4
        with:
          path: .godot-art-check/Godot_v4.7.2-stable_linux.x86_64
          key: godot-4.7.2-linux-art-pipeline-v1
      - name: Install Godot if necessary
        shell: bash
        run: |
          if [ ! -f .godot-art-check/Godot_v4.7.2-stable_linux.x86_64 ]; then
            mkdir -p .godot-art-check
            curl -fL --retry 3 --connect-timeout 20 -o .godot-art-check/godot.zip \
              https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
            unzip -oq .godot-art-check/godot.zip -d .godot-art-check/
            rm .godot-art-check/godot.zip
          fi
          chmod +x .godot-art-check/Godot_v4.7.2-stable_linux.x86_64
      - name: Cold Godot editor import, parse enabled plugin
        run: ./.godot-art-check/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit
      - name: Focused safe image preview and traversal tests
        run: ./.godot-art-check/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tools/check_starlit_art_pipeline.gd
