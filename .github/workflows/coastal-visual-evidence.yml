name: First Act Visual Evidence
on:
  push:
    paths:
      - "scripts/world_coastal_scene.gd"
      - "scripts/world_coastal_audio.gd"
      - "scripts/world_structure.gd"
      - "scripts/first_act_world.gd"
      - "scripts/first_act_actor.gd"
      - "assets/art/exteriors/coast_final_pass/**"
      - "data/levels/v4/coastal_scenery.json"
      - "tools/capture_coastal_visuals.gd"
      - "tools/smoke_coastal_exterior.gd"
      - ".github/workflows/coastal-visual-evidence.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: starlit-visual-evidence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render-first-act:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install software GL display and Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri >/dev/null
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Import official art and scene textures
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit
      - name: Verify outdoor facades, route/cave art, PCM and actor response
        run: timeout 120s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tools/smoke_coastal_exterior.gd
      - name: Render five real gameplay visual QA frames
        shell: bash
        run: |
          mkdir -p build/art-qa
          timeout 180s xvfb-run -a -s "-screen 0 1280x720x24" ./Godot_v4.7.2-stable_linux.x86_64 --path . --rendering-method gl_compatibility --script res://tools/capture_coastal_visuals.gd
          test -s build/art-qa/map_coast_01.png
          test -s build/art-qa/map_coast_02.png
          test -s build/art-qa/map_coast_03.png
          test -s build/art-qa/map_coast_04.png
          test -s build/art-qa/morning_dew_inn.png
          test -s build/art-qa/manifest.json
      - name: Upload visual QA evidence and contract
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Starlit-A7-A12-FirstAct-Visual-QA
          path: build/art-qa/
          retention-days: 14
