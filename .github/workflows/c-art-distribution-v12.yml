name: C-line V12 asset distribution integrity

on:
  push:
    branches:
      - 'Main2美术优化版'
    paths:
      - 'data/assets/c_art_usage_*_v12.json'
      - 'data/assets/c_art_nonimage_groups_v12.json'
      - 'data/assets/c_art_group_contracts_v12.json'
      - 'data/assets/c_act01_semantic_rematch_v11.json'
      - 'assets/art/source_packs/**'
      - 'assets/art/external/cc0_named_v1/**'
      - 'tools/audit_art_usage_v12.py'
      - 'scripts/c_art_distribution_gallery.gd'
      - 'scenes/c_art_distribution_gallery.tscn'
      - 'tools/smoke_c_art_distribution_gallery_v12.gd'
      - '.github/workflows/c-art-distribution-v12.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-inventory:
    name: Static third-party image and source custody integrity
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run image, archive, group, reference and blob audit
        run: python tools/audit_art_usage_v12.py --verify-git-blobs
      - name: Reminder of non-tested final commercial gate
        run: echo "Static pass does NOT mean Godot visual acceptance or a complete first act."
      - name: Install official Godot 4.7.2
        shell: bash
        run: |
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Import C-line art gallery and parse shaders/scripts
        run: timeout 180s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit
      - name: Render and filter 27 grouped art collections
        run: timeout 170s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tools/smoke_c_art_distribution_gallery_v12.gd
