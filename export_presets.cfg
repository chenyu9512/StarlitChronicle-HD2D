[preset.0]

name="iOS"
platform="iOS"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
; Full iOS game: export non-imported story/world JSON loaded through FileAccess.
export_filter="all_resources"
include_filter="*.json,*.csv,*.txt,*.otf,*.fontbytes"
exclude_filter=""
export_path="build/ios/StarlitChronicle.xcodeproj"

