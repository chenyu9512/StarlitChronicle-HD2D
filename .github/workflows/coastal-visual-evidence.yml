name: First Act Visual Evidence
# Development batch policy: heavy jobs are manual-only, never per push.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: starlit-visual-evidence-${{ github.ref }}
  # Preserve in-flight GPU captures when unrelated developers push to main.
  cancel-in-progress: false
jobs:
  render-first-act:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install software GL display and Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri >/dev/null
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Import official art and scene textures
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit
      - name: Verify outdoor facades, route/cave art, PCM and actor response
        run: timeout 120s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tools/smoke_coastal_exterior.gd
      - name: Render seven real gameplay visual QA frames
        shell: bash
        run: |
          mkdir -p build/art-qa
          timeout 180s xvfb-run -a -s "-screen 0 1280x720x24" ./Godot_v4.7.2-stable_linux.x86_64 --path . --rendering-method gl_compatibility --script res://tools/capture_coastal_visuals.gd
          test -s build/art-qa/map_coast_01.png
          test -s build/art-qa/map_coast_02.png
          test -s build/art-qa/map_coast_03.png
          test -s build/art-qa/map_coast_04.png
          test -s build/art-qa/morning_dew_inn.png
          test -s build/art-qa/map_coast_01_night.png
          test -s build/art-qa/map_coast_04_depth.png
          test -s build/art-qa/manifest.json
      - name: Capture P4 prologue in-world festival, meteor, blackout and time-jump frames
        shell: bash
        run: |
          timeout 180s xvfb-run -a -s "-screen 0 1280x720x24" ./Godot_v4.7.2-stable_linux.x86_64 --path . --rendering-method gl_compatibility --script res://tools/capture_prologue_visuals.gd
          test -s build/art-qa/prologue_festival.png
          test -s build/art-qa/prologue_black_star_world.png
          test -s build/art-qa/prologue_blackout.png
          test -s build/art-qa/prologue_ten_years.png
          test -s build/art-qa/prologue_black_star_cinematic.png
          test -s build/art-qa/prologue_manifest.json
          test -s build/art-qa/p5_star_arrival_000.png
          test -s build/art-qa/p5_chengzhou_intercept_018.png
          test -s build/art-qa/p5_lanyin_moves_033.png
          test -s build/art-qa/p5_rear_guard_000.png
          test -s build/art-qa/p5_escape_025.png
          test -s build/art-qa/p5_escape_040.png
          test -s build/art-qa/p5_ash_morning.png
          test -s build/art-qa/p5_ten_year_match.png
      - name: Upload visual QA evidence and contract
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Starlit-FirstAct-and-Prologue-P4-Visual-QA
          path: build/art-qa/
          retention-days: 14
