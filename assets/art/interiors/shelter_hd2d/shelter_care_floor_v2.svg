<svg xmlns="http://www.w3.org/2000/svg" width="128" height="32" viewBox="0 0 128 32" shape-rendering="crispEdges">
  <!-- 4 seamlessly repeatable 32px clinic floor material swatches; alpha keeps the existing V3 atlas visible. -->
  <!-- Intake: pale, washed oak / linen-toned threshold. -->
  <rect width="32" height="32" fill="#c5ac8b" fill-opacity=".76"/>
  <path d="M0 9H32M0 25H32" stroke="#745d4c" stroke-opacity=".27"/>
  <path d="M6 3h8M21 16h7M3 29h5" stroke="#f2dec0" stroke-opacity=".35" stroke-width="2"/>
  <rect x="16" y="10" width="1" height="14" fill="#7d6856" fill-opacity=".18"/>
  <rect x="28" y="26" width="2" height="2" fill="#695944" fill-opacity=".3"/>
  <!-- Recovery wards: warmer, muted reddish wood grain with irregular woven scuffs. -->
  <rect x="32" width="32" height="32" fill="#ab8d78" fill-opacity=".79"/>
  <path d="M32 7H64M32 23H64" stroke="#594b46" stroke-opacity=".3"/>
  <path d="M36 11h12M51 28h9M40 4h18M36 18h8" stroke="#f3d8bd" stroke-opacity=".29" stroke-width="2"/>
  <rect x="47" y="8" width="1" height="14" fill="#664e48" fill-opacity=".15"/>
  <rect x="57" y="24" width="2" height="2" fill="#69564e" fill-opacity=".25"/>
  <!-- Triage: desaturated slate/stone jointing, visibly cooler than linen. -->
  <rect x="64" width="32" height="32" fill="#81999a" fill-opacity=".78"/>
  <path d="M64 16H96M80 0v16M73 16v16" stroke="#3d5f65" stroke-opacity=".32"/>
  <path d="M67 3h7M84 21h9M76 27h3" stroke="#cdd6c7" stroke-opacity=".32" stroke-width="2"/>
  <rect x="92" y="10" width="2" height="2" fill="#456c72" fill-opacity=".25"/>
  <rect x="66" y="24" width="2" height="2" fill="#f1ebda" fill-opacity=".18"/>
  <!-- Pharmacy: dry sage clay blocks with warm mortar to avoid medical-blue neon. -->
  <rect x="96" width="32" height="32" fill="#859b89" fill-opacity=".78"/>
  <path d="M96 11H128M96 27H128M113 0v11M106 11v16" stroke="#496453" stroke-opacity=".3"/>
  <path d="M99 5h6M114 16h8M101 30h11" stroke="#c9d3b9" stroke-opacity=".32" stroke-width="2"/>
  <rect x="120" y="28" width="3" height="2" fill="#536852" fill-opacity=".22"/>
</svg>
