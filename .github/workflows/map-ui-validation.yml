name: Map UI Gameplay Validation
on:
  push:
    paths:
      - "scripts/map_view.gd"
      - "scripts/map_hud.gd"
      - "scripts/first_act.gd"
      - "scripts/first_act_ui.gd"
      - "scripts/rpg_menu.gd"
      - "tools/smoke_map_ui.gd"
      - "tools/smoke_world_production.gd"
      - "tools/smoke_world_story_interactions.gd"
      - "tools/smoke_world_checkpoints.gd"
      - "scripts/world_geography.gd"
      - "scripts/world_level_v3.gd"
      - "data/levels/world_levels_v3.json"
      - "data/levels/v3/**"
      - "tools/materialize_world_v3.py"
      - "tools/map_v3_editor.py"
      - "tools/smoke_world_v3.gd"
      - "scripts/world_fog_v3.gd"
      - "data/levels/town_director_v4.json"
      - "scripts/town_director.gd"
      - "tools/smoke_town_direction_v4.gd"
      - "tools/smoke_world_fog_v3.gd"
      - "scripts/world_town_life.gd"
      - "scripts/world_service_menu.gd"
      - "scripts/world_npc_visual.gd"
      - "scripts/world_ambience.gd"
      - "scripts/world_registry.gd"
      - "scripts/first_act_world.gd"
      - "scripts/world_interior_art.gd"
      - "scripts/world_interior_v4.gd"
      - "data/levels/v4/interiors/**"
      - "assets/art/interiors/morning_dew_inn/**"
      - "tools/smoke_inn_art.gd"
      - "tools/smoke_coastal_interiors.gd"
      - "assets/art/interiors/coastal_district/**"
      - "data/levels/world_atlas_v2.json"
      - ".github/workflows/map-ui-validation.yml"
  pull_request:
    paths:
      - "scripts/map_view.gd"
      - "scripts/map_hud.gd"
      - "scripts/first_act.gd"
      - "scripts/first_act_ui.gd"
      - "scripts/rpg_menu.gd"
      - "tools/smoke_map_ui.gd"
      - "tools/smoke_world_production.gd"
      - "tools/smoke_world_story_interactions.gd"
      - "tools/smoke_world_checkpoints.gd"
      - "scripts/world_geography.gd"
      - "scripts/world_level_v3.gd"
      - "data/levels/world_levels_v3.json"
      - "data/levels/v3/**"
      - "tools/materialize_world_v3.py"
      - "tools/map_v3_editor.py"
      - "tools/smoke_world_v3.gd"
      - "scripts/world_fog_v3.gd"
      - "data/levels/town_director_v4.json"
      - "scripts/town_director.gd"
      - "tools/smoke_town_direction_v4.gd"
      - "tools/smoke_world_fog_v3.gd"
      - "scripts/world_town_life.gd"
      - "scripts/world_service_menu.gd"
      - "scripts/world_npc_visual.gd"
      - "scripts/world_ambience.gd"
      - "scripts/world_registry.gd"
      - "scripts/first_act_world.gd"
      - "scripts/world_interior_art.gd"
      - "scripts/world_interior_v4.gd"
      - "data/levels/v4/interiors/**"
      - "assets/art/interiors/morning_dew_inn/**"
      - "tools/smoke_inn_art.gd"
      - "tools/smoke_coastal_interiors.gd"
      - "assets/art/interiors/coastal_district/**"
      - "data/levels/world_atlas_v2.json"
      - ".github/workflows/map-ui-validation.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  map-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate all forty authorable level files
        run: python3 tools/materialize_world_v3.py --verify
      - name: Download Godot 4.7.2
        run: |
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Import map and UI dependencies
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit
      - name: Run minimap and world atlas gameplay regression
        run: timeout 90s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tools/smoke_map_ui.gd
      - name: Validate editable V3 wilderness geometry and hand-painted collision rules
        run: timeout 120s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tools/smoke_world_v3.gd
      - name: Discoverable local map and persistent indoor fog
        run: timeout 90s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tools/smoke_world_fog_v3.gd
      - name: DQ-inspired authored town staging, service routes and interior design
        run: timeout 120s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tools/smoke_town_direction_v4.gd
      - name: Validate Morning Dew Inn real room art and existing gameplay
        run: timeout 120s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tools/smoke_inn_art.gd
      - name: Validate all 12 coastal interior art scenes in live gameplay
        run: timeout 180s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tools/smoke_coastal_interiors.gd
      - name: Validate world sector routing, terrain and interiors
        run: timeout 120s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tools/smoke_world_production.gd
      - name: Validate story-safe world travel and physical dungeon treasure
        run: timeout 90s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tools/smoke_world_story_interactions.gd
      - name: Validate regional inhabitants and real services
        run: timeout 90s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tools/smoke_town_life.gd
      - name: Validate dungeon and house checkpoint plus field-camp saving
        run: timeout 90s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tools/smoke_world_checkpoints.gd
