name: Phase 19 World Story Acceptance
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
# Development batch policy: heavy jobs are manual-only, never per push.
on:
  workflow_dispatch:
jobs:
  phase19-world:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate all 120 canon quest destinations
        run: |
          python tools/validate_phase19_world_anchors.py
          python tools/validate_phase19_scene_dressing.py
          python tools/validate_phase19_lost_page_rooms.py
          python tools/validate_phase19_lost_page_puzzles.py
          python tools/validate_phase19_life_rooms.py
          python tools/validate_phase19_companion_regional_rooms.py
      - name: Install Godot 4.7.2
        run: |
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Compile and import project
        run: timeout 120s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit
      - name: Retain original five-stage side quest gameplay
        run: timeout 90s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tools/smoke_story_side_quests.gd
      - name: Retain phase19-1 story menu and save compatibility
        run: timeout 90s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tools/smoke_branch_story_phase19.gd
      - name: Test 120 quest locations and phase19-2 three real interactions
        run: timeout 180s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tools/smoke_story_world_phase19_2.gd
      - name: Twelve distinct lost-page interiors, walkability and persistence
        run: timeout 180s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tools/smoke_phase19_lost_page_rooms.gd
      - name: Twelve canonical evidence puzzles, wrong answers and persistent deduction
        run: timeout 180s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tools/smoke_phase19_lost_page_puzzles.gd
      - name: Nineteen walkable life quests, saved exhibits and five outdoor sites
        run: timeout 180s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tools/smoke_phase19_life_rooms.gd
      - name: Phase19-7 all 54 companion/regional rooms and outdoor continuity
        run: timeout 240s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tools/smoke_phase19_companion_regional_rooms.gd
