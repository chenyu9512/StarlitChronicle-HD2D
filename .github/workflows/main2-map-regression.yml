name: Main2 Map and Third-party Terrain Acceptance
on:
  workflow_dispatch:
  push:
    branches: ["Main2美术优化版"]
    paths:
      - ".github/workflows/main2-map-regression.yml"
      - "scripts/map_hud.gd"
      - "scripts/map_view.gd"
      - "scripts/first_act.gd"
      - "scripts/world_tileset_pool.gd"
      - "scripts/c_art_overrides.gd"
      - "scripts/c_coherent_terrain_materials.gd"
      - "tools/smoke_c_material_atlas_repair.gd"
      - "scripts/world_terrain_atlas_registry.gd"
      - "scripts/third_party_terrain_adapter.gd"
      - "tools/smoke_map_ui.gd"
      - "tools/smoke_no_fog_local_map.gd"
      - "tools/smoke_all_maps_minimap.gd"
      - "tools/smoke_c_shared_terrain_v8.gd"
      - "tools/smoke_world_production.gd"
      - "tools/validate_no_fog_local_map.py"
      - "docs/qa-main2-map-trigger.json"
permissions:
  contents: read
jobs:
  map-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce no-fog and restored map-navigation policy
        run: python3 tools/validate_no_fog_local_map.py
      - name: Install official Godot 4.7.2
        run: |
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Headless asset import and script parser
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit
      - name: Run actual map and tile smoke tests, preserving every result
        shell: bash
        run: |
          set +e
          mkdir -p qa-map-results
          failures=0
          for file in \
            tools/smoke_map_ui.gd \
            tools/smoke_no_fog_local_map.gd \
            tools/smoke_all_maps_minimap.gd \
            tools/smoke_c_shared_terrain_v8.gd \
            tools/smoke_world_tileset_pool.gd \
            tools/smoke_world_production.gd; do
            basename="${file##*/}"
            echo "::group::${file}"
            timeout 150s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script "res://${file}" > "qa-map-results/${basename}.log" 2>&1
            result=$?
            tail -n 45 "qa-map-results/${basename}.log"
            if [ "$result" -ne 0 ]; then
              failures=$((failures+1))
              echo "FAIL ${file} (exit ${result})"
            else
              echo "PASS ${file}"
            fi
            echo "::endgroup::"
          done
          echo "MAP_QA_FAILED=${failures}"
          exit "$((failures != 0))"
      - name: Upload exact Godot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main2-map-real-engine-logs
          path: qa-map-results/
          if-no-files-found: warn
