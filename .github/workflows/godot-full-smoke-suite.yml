name: Starlit Full Godot Smoke Suite (all smoke scripts)
# Opt-in validation of every tools/**/smoke_*.gd, with isolated sharded logs.
# No branch/PR cleanup or code writeback.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/qa-full-trigger.json"
permissions:
  contents: read
concurrency:
  group: starlit-full-godot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  all-smokes:
    name: "Godot 4.7.2 all smoke scripts / shard ${{ matrix.shard }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.7.2
        run: |
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Headless import and parser check
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit
      - name: Execute every smoke test in shard; do not skip after one failure
        run: |
          python3 tools/d_control/run_full_smoke_suite.py \
            --godot ./Godot_v4.7.2-stable_linux.x86_64 \
            --shard ${{ matrix.shard }} --shards 4 --timeout 180 \
            --output qa-full-results
      - name: Preserve all executed per-test logs and JSON summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-full-smoke-shard-${{ matrix.shard }}
          path: qa-full-results/
          if-no-files-found: warn
