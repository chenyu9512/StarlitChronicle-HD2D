name: Main2 Map and Third-party Terrain Acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  map-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce no-fog and restored map-navigation policy
        run: python3 tools/validate_no_fog_local_map.py
      - name: Validate first-act six distinct production layouts
        run: python3 tools/validate_act01_distinct_layouts.py
      - name: Reject wrong V18 art roles, missing sprites, and unused image copies
        run: python3 tools/validate_c_act01_hd2d_v18.py
      - name: Install official Godot 4.7.2
        run: |
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Headless asset import and script parser
        id: godot_import
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit
      - name: Run actual map and tile smoke tests, preserving every result
        shell: bash
        run: |
          set +e
          mkdir -p qa-map-results
          failures=0
          for file in \
            tools/smoke_map_ui.gd \
            tools/smoke_no_fog_local_map.gd \
            tools/smoke_all_maps_minimap.gd \
            tools/smoke_c_shared_terrain_v8.gd \
            tools/smoke_c_act01_hd2d_v18.gd \
            tools/smoke_c_art_packs.gd \
            tools/smoke_c_terrain_group_import_v9.gd \
            tools/smoke_c_coastal_render.gd \
            tools/smoke_b_act01_journey.gd \
            tools/smoke_world_tileset_pool.gd \
            tools/smoke_world_production.gd \
            tools/smoke_act01_distinct_world_layouts.gd \
            tools/audit_act01_visible_prop_scale.gd; do
            basename="${file##*/}"
            echo "::group::${file}"
            timeout 150s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script "res://${file}" > "qa-map-results/${basename}.log" 2>&1
            result=$?
            tail -n 45 "qa-map-results/${basename}.log"
            if [ "$result" -ne 0 ]; then
              failures=$((failures+1))
              echo "FAIL ${file} (exit ${result})"
            else
              echo "PASS ${file}"
            fi
            echo "::endgroup::"
          done
          echo "MAP_QA_FAILED=${failures}"
          exit "$((failures != 0))"
      - name: Render actual six first-act layout preview frames
        # Evidence should be collected even when unrelated world-zone QA is
        # red. Uploading screenshots NEVER marks the gameplay release green.
        if: always() && steps.godot_import.outcome == 'success'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri >/dev/null
          timeout 180s xvfb-run -a -s "-screen 0 1280x720x24" ./Godot_v4.7.2-stable_linux.x86_64 --path . --rendering-method gl_compatibility --script res://tools/capture_act01_distinct_layouts.gd
      - name: Upload real six-layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main2-six-distinct-actual-godot-layouts
          path: build/layout-qa/
          if-no-files-found: warn
      - name: Upload exact Godot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main2-map-real-engine-logs
          path: qa-map-results/
          if-no-files-found: warn
