name: Export HD-2D PNG Assets
# Development batch policy: heavy jobs are manual-only, never per push.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic asset renderer
        run: python -m pip install cairosvg pillow
      - name: Check originals, render PNG and verify sizes
        run: |
          python tools/validate_hd2d_art.py
          python tools/export_hd2d_svg.py
          python tools/validate_hd2d_art.py --check-png
          python tools/make_art_contact_sheet.py
      - name: Package reviewed image assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root=Path('assets/art')
          with ZipFile('starlit_art_batches_0_3_png.zip','w',ZIP_DEFLATED,compresslevel=6) as z:
              for p in sorted(root.rglob('*.png')):
                  z.write(p,p.as_posix())
          print('Packed',sum(1 for p in root.rglob('*.png')),'PNG images')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: starlit-art-batches-0-3-png
          path: starlit_art_batches_0_3_png.zip
          retention-days: 30
      - name: Commit generated images to the same branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/art/
          if ! git diff --cached --quiet; then
            git commit -m "art: render batch 0-3 SVG masters to 89 Godot-ready PNGs"
            git push origin HEAD:${{ github.ref_name }}
          fi
