name: HD-2D World Render Budget Validation
# Opt-in batch: no per-commit CI consumption, no branch creation/PR/force push.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: render-budget-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate 40 authored level sidecars
        run: python3 tools/materialize_world_v3.py --verify
      - name: Keep no-fog local map UX contract
        run: python3 tools/validate_no_fog_local_map.py
      - name: Install official Godot 4.7.2
        run: |
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Compile GDScript and import textures
        run: timeout 120s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit
      - name: Check bounded, shared TileSets and safe reentry
        run: timeout 150s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tools/smoke_world_tileset_pool.gd
      - name: Check low, standard and high world rendering budgets
        run: timeout 150s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tools/smoke_world_render_quality.gd
      - name: Check existing hand-drawn coastal staging
        run: timeout 120s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tools/smoke_c_coastal_render.gd
      - name: Check all 40 maps, indoor entrances and geometry
        run: timeout 180s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tools/smoke_world_production.gd
      - name: Preserve full-fog-free minimap and 40 local maps
        run: timeout 180s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tools/smoke_all_maps_minimap.gd
