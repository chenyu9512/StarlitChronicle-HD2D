name: Desktop Playable Preview

on:
  push:
    paths:
      - "export_presets.cfg"
      - ".github/workflows/desktop-preview.yml"
      - "scripts/**"
      - "scenes/**"
      - "data/levels/world_levels_v3.json"
      - "data/levels/v3/**"
      - "assets/art/tilesets/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starlit-desktop-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Get official Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          release=https://github.com/godotengine/godot/releases/download/4.7.2-stable
          curl -fL --retry 3 -o godot.zip "$release/Godot_v4.7.2-stable_linux.x86_64.zip"
          curl -fL --retry 3 -o export.tpz "$release/Godot_v4.7.2-stable_export_templates.tpz"
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          mkdir -p /tmp/starlit-templates "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q export.tpz -d /tmp/starlit-templates
          cp /tmp/starlit-templates/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
      - name: Import Godot scenes
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Export Windows and Linux playable archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/windows build/linux
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release "Windows Desktop" build/windows/StarlitChronicle.exe
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release "Linux" build/linux/StarlitChronicle.x86_64
          test -s build/windows/StarlitChronicle.exe
          test -s build/linux/StarlitChronicle.x86_64
          chmod +x build/linux/StarlitChronicle.x86_64
          (cd build/windows && zip -q -r ../StarlitChronicle-Windows-x64-preview.zip .)
          (cd build/linux && zip -q -r ../StarlitChronicle-Linux-x64-preview.zip .)
          test -s build/StarlitChronicle-Windows-x64-preview.zip
          test -s build/StarlitChronicle-Linux-x64-preview.zip
          echo "PASS: two playable desktop preview packages generated"
      - uses: actions/upload-artifact@v4
        with:
          name: StarlitChronicle-Windows-x64-preview
          path: build/StarlitChronicle-Windows-x64-preview.zip
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: StarlitChronicle-Linux-x64-preview
          path: build/StarlitChronicle-Linux-x64-preview.zip
          retention-days: 14
