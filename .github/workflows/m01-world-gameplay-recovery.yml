name: M0.1 World Gameplay Recovery QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/qa-m01-world-recovery-trigger.json"
permissions:
  contents: read
jobs:
  recovery:
    name: "M0.1 runtime ${{ matrix.path }}"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        path:
          - tools/smoke_town_life.gd
          - tools/smoke_story_world_phase19_2.gd
          - tools/smoke_world_story_interactions.gd
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Cold import and GDScript parse
        run: timeout 150s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit
      - name: Execute original smoke assertions without bypass
        shell: bash
        run: |
          set +e
          timeout 180s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script "res://${{ matrix.path }}" > m01-recovery.log 2>&1
          result=$?
          tail -n 90 m01-recovery.log
          echo "M0.1 ORIGINAL SMOKE: ${{ matrix.path }} exit=${result}"
          exit ${result}
      - name: Upload complete source-aligned QA log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "m01-recovery-${{ strategy.job-index }}"
          path: m01-recovery.log
          if-no-files-found: warn
