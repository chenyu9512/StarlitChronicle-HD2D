name: Render Coastal Monster Idle Animation
on:
  push:
    branches: [main]
    paths:
      - "tools/animate_coast_monsters.py"
      - ".github/workflows/render-coast-idles.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starlit-coast-idle-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PNG editing dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Convert static coastal idles into four genuine sprite frames
        run: |
          python tools/animate_coast_monsters.py
          python - <<'PY'
          from PIL import Image, ImageChops
          from pathlib import Path
          for image in Path("assets/art/monsters/coast").glob("*/idle_4frames.png"):
              im=Image.open(image).convert("RGBA")
              left=im.crop((0,0,128,128))
              right=im.crop((128,0,256,128))
              delta=ImageChops.difference(left,right)
              assert delta.convert("RGB").getbbox() or delta.getchannel("A").getbbox(), image
          print("PASS: all coastal idle sprites include motion")
          PY
      - name: Commit all nine refined sheets and SVG masters to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/art/monsters/coast/*/idle_4frames.png assets/art/monsters/coast/*/idle_4frames.svg
          if git diff --cached --quiet; then
            echo "Frames already up to date."
            exit 0
          fi
          git commit -m "art(animation): deliver nine four-frame coastal monster idles"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:refs/heads/main; then
              echo "Animation sheets pushed to main."
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo "Could not fast-forward main after four attempts." >&2
          exit 1
