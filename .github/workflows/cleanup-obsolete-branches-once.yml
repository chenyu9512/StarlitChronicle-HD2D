name: One-time Obsolete Branch Cleanup
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-obsolete-branches-once.yml"
permissions:
  contents: write
jobs:
  cleanup:
    if: github.repository == 'chenyu9512/StarlitChronicle-HD2D'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify exact branch SHAs and zero unique commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rows=(
          "feature/game-core-cheats-v0.2|bcac2fc753ec492c6860888bb534bff14d8e8ce1"
          "feature/first-act-production-v0-3|dcd635cf09283761d9c21eb182e655015f9c75c5"
          "feature/first-act-resource-sync-v0-3|9cddf945d90c0120bc15850f3c4b21d67181f6f5"
          "backup/main-v0.1.1-before-core|50aae25b9e191f0bb81839acb344d3486365d7cc"
          "backup/main-before-first-act-20261024|12e59d23cb691a720db0d13b14e0600bcc0443d7"
          )
          for row in "${rows[@]}"; do
            name="${row%%|*}"
            expected="${row#*|}"
            actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$name" --jq .object.sha)"
            if [ "$actual" != "$expected" ]; then
              echo "::error::Branch moved: $name; expected $expected, got $actual"
              exit 1
            fi
            ahead="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$name" --jq .ahead_by)"
            if [ "$ahead" != "0" ]; then
              echo "::error::Branch has unique commits: $name ($ahead)"
              exit 1
            fi
            echo "Verified $name ($actual): zero commits missing from main"
          done
      - name: Preserve historical milestones as tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/archive-v0.1.1-before-core" \
            -f sha="50aae25b9e191f0bb81839acb344d3486365d7cc" >/dev/null
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/archive-v0.2-before-first-act" \
            -f sha="12e59d23cb691a720db0d13b14e0600bcc0443d7" >/dev/null
          echo "Archived two historical versions as tags"
      - name: Delete five obsolete branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            "feature/game-core-cheats-v0.2" \
            "feature/first-act-production-v0-3" \
            "feature/first-act-resource-sync-v0-3" \
            "backup/main-v0.1.1-before-core" \
            "backup/main-before-first-act-20261024"; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$name"
            echo "Deleted: $name"
          done
      - name: Assert only three active branches remain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(gh api "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' | sort)"
          expected="$(printf '%s\n' main content/full-story-v1 feature/content-foundation-v0-2 | sort)"
          echo "$actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Unexpected branches remain or an active branch is missing"
            exit 1
          fi
          echo "PASS: exactly three branches remain"
