name: Main2 Global Art Factory V3
on:
  push:
    branches: ["Main2美术优化版"]
    paths:
      - "tools/global_art_factory_v3.py"
      - "tools/art_style_v6.py"
      - "tools/art_style_v7.py"
      - "tools/art_style_v8.py"
      - "tools/global_art_ai_provider_v3.py"
      - "data/content/maps.json"
      - "data/assets/av_registry.json"
      - "data/levels/v4/interiors/**"
      - "tools/test_global_art_factory_v3.py"
      - "tools/generate_art.py"
      - "tools/audit_legacy_cleanup.py"
      - "addons/starlit_art_pipeline/plugin.gd"
      - ".github/workflows/main2-global-art-factory-v3.yml"
  workflow_dispatch:
jobs:
  full-game-art-factory:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            data/content
            data/assets
            data/levels/v4/interiors
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Reject retired art generator and obsolete V5 dependencies
        run: |
          test ! -e tools/art_style_v5.py
          ! grep -q -- '--legacy' tools/generate_art.py
      - name: Unit regression coverage
        run: python tools/test_global_art_factory_v3.py
      - name: Produce all canonical art candidates
        run: python tools/generate_art.py --project . --force
      - name: Prepare high-detail full-roster model briefs without API calls
        run: python tools/global_art_ai_provider_v3.py --project . --jobs-only
      - name: Validate model art brief coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('build/starlit_global_art_factory_v3/model_sources/render_jobs.jsonl')
          jobs=[json.loads(line) for line in path.read_text().splitlines() if line]
          canonical=json.loads(Path('data/assets/av_registry.json').read_text())
          maps=json.loads(Path('data/content/maps.json').read_text())['entries']
          rooms=list(Path('data/levels/v4/interiors').glob('*.json'))
          expected=10*len(canonical['regions'])+len(maps)+len(rooms)+sum(len(canonical[k]) for k in ('characters','npcs','monsters','bosses'))
          assert len(jobs)==expected, (len(jobs),expected)
          assert len({(j['group'],j['id']) for j in jobs})==expected
          print('MODEL ART PROMPTS:', len(jobs))
          PY
      - name: Validate full canonical registry coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('build/starlit_global_art_factory_v3')
          data=json.loads((root/'candidate_manifest.json').read_text())
          counts=data['counts']
          assert not data['errors'], data['errors'][:10]
          av=json.loads(Path('data/assets/av_registry.json').read_text())
          maps=json.loads(Path('data/content/maps.json').read_text())['entries']
          rooms=list(Path('data/levels/v4/interiors').glob('*.json'))
          expected={'terrain':len(av['regions']), 'ui':len(av['regions']),
                    'props':8*len(av['regions']), 'maps':len(maps),
                    'interiors':len(rooms), 'bosses':len(av['bosses']),
                    'characters':len(av['characters']), 'npcs':len(av['npcs']),
                    'monsters':len(av['monsters'])}
          assert counts==expected, (counts,expected)
          assert sum(counts.values())==len(data['assets'])
          assert not data['game_runtime_modified']
          for item in data['assets']:
              assert (root/item['path']).is_file(), item['path']
          print('FULL GAME CANDIDATE COVERAGE:', counts, 'TOTAL', len(data['assets']))
          PY
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starlit-global-art-factory-v3-manifests
          path: |
            build/starlit_global_art_factory_v3/candidate_manifest.json
            build/starlit_global_art_factory_v3/candidate_index.json
            build/starlit_global_art_factory_v3/model_sources/render_jobs.jsonl
          if-no-files-found: warn
