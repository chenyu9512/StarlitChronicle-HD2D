name: Unique 40-Map Layout Acceptance
# Development batch policy: heavy jobs are manual-only, never per push.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unique-maps:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify map sidecars exactly mirror their canonical collection
        run: python3 tools/materialize_world_v3.py --verify
      - name: Static-audit all 21 unique fields, catalogs and 336 art fixture coordinates
        run: python3 tools/validate_field_ecology_v7.py
      - name: Install Godot 4.7.2
        run: |
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Import scenes and resources
        run: timeout 120s ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Require independent map sizes, layouts, quest reachability and authored bridges
        run: timeout 120s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tools/smoke_world_v3.gd
      - name: Verify all 120 map discoveries, sequential prerequisites, item rewards and save restoration
        run: timeout 180s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tools/smoke_world_discoveries.gd
      - name: Validate eight region-specific dungeon puzzle models and save-safe treasure
        run: timeout 180s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tools/smoke_dungeon_puzzles_v7.gd
      - name: Check eleven live town ecologies, district stations and persistent community activities
        run: timeout 180s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tools/smoke_town_ecology_v7.gd
      - name: Check 21 physical wilderness sectors, weather, daily harvesting, secret portals and saves
        run: timeout 180s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tools/smoke_field_ecology_v7.gd
      - name: Verify all 40 physical maps, city gates and building interiors
        run: timeout 180s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tools/smoke_world_production.gd
