name: A-line Live Boss Batch Acceptance
# Opt-in: 66 scripted bosses x 3 difficulties in the REAL battle loop.
# No global full-smoke rerun for each incremental combat change.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/qa-a-boss-trigger.json"
permissions:
  contents: read
concurrency:
  group: starlit-a-boss-batch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  live-bosses:
    name: "Godot 4.7.2 / 66 Boss live command replay"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.7.2
        run: |
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Headless import / parser acceptance
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit
      - name: Run all actual boss encounters without cheats
        run: |
          timeout 180s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . \
            --script res://tools/smoke_a_line_live_bosses.gd 2>&1 | tee a-line-boss-batch.log
          exit ${PIPESTATUS[0]}
      - name: Upload boss diagnostics on pass or fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a-line-boss-batch
          path: a-line-boss-batch.log
          if-no-files-found: warn
