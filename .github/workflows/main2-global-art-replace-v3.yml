name: "Main2 · Replace Old Art With Generated V3"
on:
  push:
    branches: ["Main2美术优化版"]
    paths:
      - ".github/workflows/main2-global-art-replace-v3.yml"
      - "tools/install_global_factory_v3.py"
      - "tools/generate_content_icons_v1.py"
      - "tools/sync_c_art_runtime_registry.py"
      - "tools/check_c_art_runtime_registry.py"
      - "assets/art/runtime/scene_details_v1/**"
      - "assets/art/runtime/content_icons_v1/**"
      - "scripts/world_coastal_scene.gd"
      - "scripts/c_coastal_painter.gd"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: main2-global-art-promotion
  cancel-in-progress: false
jobs:
  produce-publish-prune:
    if: github.ref == 'refs/heads/Main2美术优化版'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install generation requirements
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Generate all canonical art and replace runtime asset set
        run: python tools/install_global_factory_v3.py --project .
      - name: Assert replacement assets and activation are real
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from PIL import Image
          root=Path('assets/art/runtime/global_factory_v3')
          data=json.loads((root/'active.json').read_text())
          total=data['asset_count']
          assert data['schema']=='starlit.global_factory.live.v3'
          assert total>=451, total
          assert len(data['assets'])==total
          for slot,meta in data['assets'].items():
              file=Path(meta['path'].removeprefix('res://'))
              assert file.is_file(), (slot,file)
              with Image.open(file) as im:
                  im.verify()
          for rid in ['region_coast','region_oaths','region_forge','region_isles',
                      'region_mirror','region_oldland','region_sanctum','region_city']:
              for kind in ['ground','water']:
                  file=root/'terrain'/f'{rid}_{kind}.png'
                  with Image.open(file) as image:
                      assert image.size==(256,256)
          print('PASS: installed',total,'generated PNGs and 16 role-correct world atlases')
          PY
      - name: Synchronize official runtime registry after replacing art
        shell: bash
        run: |
          git add -A assets/art
          python tools/generate_content_icons_v1.py --project . --verify-only
          python tools/sync_c_art_runtime_registry.py --project .
          python tools/check_c_art_runtime_registry.py
      - name: Import entire Godot project (not fake acceptance)
        shell: bash
        run: |
          curl -fLsS --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          timeout 180s ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit > import.log 2>&1 || { tail -n 160 import.log; exit 1; }
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load script' import.log; then
            echo "Import reported script errors; aborting replacement."
            exit 1
          fi
      - name: Validate new art shown in real game nodes
        shell: bash
        run: |
          failed=0
          for name in smoke_c_material_atlas_repair smoke_c_character_motion smoke_main2_act01_live_boss_motion smoke_c_coastal_render smoke_content_icons_v1; do
            timeout 45s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script "res://tools/$name.gd" > "$name.log" 2>&1 || failed=1
            tail -n 35 "$name.log"
            if grep -E 'SCRIPT ERROR:|ERROR: Failed to load script' "$name.log"; then failed=1; fi
          done
          exit "$failed"
      - name: Commit generated runtime and old-asset cleanup to Main2
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/art data/assets/c_art_runtime_registry_v1.json
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No art changes"
            exit 0
          fi
          git commit -m "feat(art): replace retired visuals with 451 generated V3 images and prune unused old assets"
          git push origin HEAD:"Main2美术优化版"
      - name: Upload generation and Godot acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main2-generated-art-adoption-v3
          path: |
            build/global_art_v3_install_report.json
            build/starlit_global_art_factory_v3/candidate_manifest.json
            import.log
            smoke_c_material_atlas_repair.log
            smoke_content_icons_v1.log
            smoke_c_character_motion.log
            smoke_main2_act01_live_boss_motion.log
          if-no-files-found: warn
          retention-days: 7
