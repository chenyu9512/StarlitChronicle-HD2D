name: "Main2 · Remove Old Godot Art Import Cache"
on:
  push:
    branches: ["Main2美术优化版"]
    paths:
      - ".github/workflows/main2-art-import-cache-cleanup-v3.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  untrack-disposable-art-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Remove tracked disposable .import files only
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          raw=subprocess.check_output(['git','ls-files','-z','assets/art/'])
          old=[s.decode() for s in raw.split(b'\0') if s and s.decode().endswith('.import')]
          for path in old:
              subprocess.run(['git','rm','-f','--',path],check=True,stdout=subprocess.DEVNULL)
          print('DELETED TRACKED GODOT IMPORT CACHES:',len(old))
          print('GENERATED PNG FILES PRESERVED:',len(list(Path('assets/art/runtime/global_factory_v3').rglob('*.png'))))
          PY
      - name: Commit cache removal without deleting real image sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(art): delete tracked disposable Godot .import files"
          git push origin HEAD:"Main2美术优化版"
