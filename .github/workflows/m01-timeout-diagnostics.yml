name: M0.1 Timeout Root Cause Diagnostics
# Diagnostics only; no state mutations outside process-local test saves.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docs/qa-m01-timeout-trigger.json"]
permissions:
  contents: read
jobs:
  trace:
    name: "M0.1 trace ${{ matrix.path }}"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        path:
          - tools/d_control/probe_m01_town_life.gd
          - tools/d_control/probe_m01_world_story.gd
          - tools/d_control/probe_m01_phase19.gd
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.7.2
        run: |
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Cold import
        run: timeout 150s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit
      - name: Root cause phase markers and exact exit code
        shell: bash
        run: |
          set +e
          timeout 105s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script "res://${{ matrix.path }}" > m01-probe.log 2>&1
          code=$?
          grep -E 'M01_PROBE|PASS:|ERROR:|SCRIPT ERROR:|Parse Error:' m01-probe.log | tail -n 90 || true
          echo "M0.1 probe result=${code}"
          exit 0
      - name: Preserve full diagnostic trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "m01-probe-${{ strategy.job-index }}"
          path: m01-probe.log
