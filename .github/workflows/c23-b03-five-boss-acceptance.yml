name: "C-line C2.3 Five B03 Boss Visual Acceptance"
# Scope-specific acceptance gate: only the explicitly committed batch marker triggers CI.
# Does not publish builds, edit main, merge branches or mutate combat rewards.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/qa-c23-five-boss-trigger.json"
permissions:
  contents: read
concurrency:
  group: c23-five-boss-${{ github.ref }}
  cancel-in-progress: false
jobs:
  b03-c23-acceptance:
    name: "Godot 4.7.2 import and 5 Boss animation states"
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: "Install Godot 4.7.2"
        shell: bash
        run: |
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: "Import all textures and parse C23 shaders and scripts"
        shell: bash
        run: |
          mkdir -p build/c23-qa
          timeout 180s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit > build/c23-qa/import.log 2>&1 || { cat build/c23-qa/import.log; exit 1; }
      - name: "Run C23 chapter 2–6 visual regression batch"
        shell: bash
        run: |
          failed=0
          for script in \
            smoke_c23_b03_body_motion \
            smoke_c23_b03_other_bosses \
            smoke_c23_b03_5boss_bundle \
            smoke_c_b03_phase_overlays \
            smoke_a_line_live_bosses
          do
            echo "Checking $script"
            set +e
            timeout 150s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script "res://tools/$script.gd" > "build/c23-qa/$script.log" 2>&1
            rc=$?
            set -e
            echo "$script actual_exit_code=$rc" | tee -a build/c23-qa/exit-codes.txt
            tail -n 25 "build/c23-qa/$script.log"
            if [ "$rc" -ne 0 ]; then
              failed=1
            fi
          done
          exit "$failed"
      - name: "Archive real Godot QA transcripts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: C23-B03-five-boss-QA-logs
          path: build/c23-qa/
          retention-days: 14
          if-no-files-found: warn
