name: "Main2 · Real Art Runtime Acceptance"
on:
  workflow_dispatch:
  push:
    branches: ["Main2美术优化版"]
    paths:
      - ".github/workflows/c-main2-art-runtime-acceptance.yml"
      - "scripts/c_third_party_walk.gd"
      - "scripts/first_act_actor.gd"
      - "scripts/battle_actors.gd"
      - "scripts/prologue_actor_blocking.gd"
      - "tools/smoke_c_act01_art_production_v10.gd"
      - "scripts/c_allocated_decor_runtime.gd"
      - "scripts/third_party_terrain_adapter.gd"
      - "scripts/world_tileset_pool.gd"
      - "scripts/world_structure.gd"
      - "tools/smoke_c_material_atlas_repair.gd"
      - "scripts/first_act_world.gd"
      - "data/assets/c_art_allocated_decor_runtime_v1.json"
      - "tools/smoke_c_character_motion.gd"
      - "tools/smoke_c_main2_art_runtime.gd"
permissions:
  contents: read
concurrency:
  group: main2-art-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  import-and-world-art:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit first-act third-party path migration (static, not commercial approval)
        run: python3 tools/audit_act01_third_party_art.py
      - name: Install official Godot 4.7.2
        shell: bash
        run: |
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Clean headless project import and GDScript parse
        shell: bash
        run: |
          mkdir -p build/main2-art-qa
          timeout 180s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit > build/main2-art-qa/import.log 2>&1 || { cat build/main2-art-qa/import.log; exit 1; }
      - name: Load first-act art, render actual map nodes and check actor strips
        shell: bash
        run: |
          failed=0
          for script in smoke_c_character_motion smoke_battle_actors smoke_c_uploaded_later_pack smoke_c_act01_art_production_v10 smoke_world_tileset_pool smoke_c_main2_art_runtime smoke_c_material_atlas_repair; do
            echo "Running $script"
            set +e
            timeout 170s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script "res://tools/$script.gd" > "build/main2-art-qa/$script.log" 2>&1
            rc=$?
            set -e
            echo "$script exit_code=$rc" | tee -a build/main2-art-qa/exits.txt
            tail -n 45 "build/main2-art-qa/$script.log"
            if [ "$rc" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - name: Upload truthful CI run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main2-art-runtime-evidence
          path: build/main2-art-qa/
          retention-days: 14
          if-no-files-found: warn
